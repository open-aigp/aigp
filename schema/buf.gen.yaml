# buf.gen.yaml — Code generation targets for AIGP protobuf schema
# https://buf.build/docs/configuration/v2/buf-gen-yaml
#
# Usage:
#   cd schema && buf generate
#
# Generated code lands in ../gen/<language>/
version: v2
managed:
  enabled: true
plugins:
  # TypeScript / JavaScript (via protobuf-es)
  - remote: buf.build/bufbuild/es
    out: ../gen/ts
    opt:
      - target=ts

  # Go
  - remote: buf.build/protocolbuffers/go
    out: ../gen/go
    opt:
      - paths=source_relative

  # Python (protobuf stubs)
  - remote: buf.build/protocolbuffers/python
    out: ../gen/python

  # OpenAPI v2 (Swagger) — generated from proto definitions
  # Requires grpc-gateway plugin for service definitions (future)
  # - remote: buf.build/grpc-ecosystem/openapiv2
  #   out: ../gen/openapi
