# buf.yaml — Buf configuration for AIGP protobuf schema
# https://buf.build/docs/configuration/v2/buf-yaml
version: v2
modules:
  - path: .
    name: buf.build/open-aigp/aigp
lint:
  use:
    - STANDARD
  except:
    # AIGP field names use snake_case matching JSON wire format
    - FIELD_LOWER_SNAKE_CASE
breaking:
  use:
    - WIRE_JSON
